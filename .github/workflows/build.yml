name: "Build Pixel Fold APK \xB7 Build 14.4 Two-Pane + Dock 5"
on:
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: pixel-fold-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Fetch exact Folio source
      uses: actions/checkout@v4
      with:
        repository: McCal-Codes/folio
        ref: 9f38861fb7d8c89896a6db0c762fd988acfc45f2
        persist-credentials: false
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
    - name: Install Android SDK 36
      shell: bash
      run: 'yes | sdkmanager --licenses >/dev/null || true

        sdkmanager "platforms;android-36" "build-tools;36.0.0"

        '
    - name: Apply Pixel Fold Build 6.2
      shell: bash
      env:
        PATCH_B64: 
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64, os, pathlib\npathlib.Path(\"/tmp/folio-build4.patch\").write_bytes(\n    base64.b64decode(os.environ[\"PATCH_B64\"])\n)\nPY\n\ngit apply --check /tmp/folio-build4.patch\ngit apply /tmp/folio-build4.patch\n\n# CustomizationSheet is edited semantically instead of by line-number\n# patching. This avoids the conflict that stopped the previous build.\npython3 - <<'PY'\nfrom pathlib import Path\nimport re\n\npath = Path(\"app/src/main/java/com/mccal/folio/CustomizationSheet.kt\")\ns = path.read_text()\n\n# Rename the Position card without depending on its line number.\nif 'SettingsCard(\"Position\")' in s:\n    s = s.replace(\n        'SettingsCard(\"Position\")',\n        'SettingsCard(if (wide) \"Pixel Fold Layout \xB7 Inner\" else \"Pixel Fold Layout \xB7 Cover\")',\n        1\n    )\n\n# Add the independent vertical Home control immediately after Apps.\nif '\"Home vertical position\"' not in s:\n    pattern = re.compile(\n   \
        \     r'(IosMenuRow\\(\"Apps\",\\s*listOf\\(false to \"Centered\", true to \"Top\"\\),\\s*p\\.pageTop,\\s*'\n        r'\\{ model\\.setPreset\\(wide, p\\.copy\\(pageTop = it\\)\\) \\},\\s*tag = \"page-position\"\\)\\s*)'\n    )\n    replacement = (\n        r'\\1'\n        '\\n        CustomizationSlider(\"Home vertical position\", '\n        'if (p.pageOffset == 0f) \"Default\" else \"${p.pageOffset.toInt()} dp\",\\n'\n        '            p.pageOffset, -220f..220f, 0f, peek = true) '\n        '{ model.setPreset(wide, p.copy(pageOffset = it)) }\\n'\n    )\n    s, count = pattern.subn(replacement, s, count=1)\n    if count != 1:\n        raise SystemExit(\"Could not locate Apps position control in CustomizationSheet.kt\")\n\ns = s.replace('\"Dock height\"', '\"Dock vertical position\"')\n# Normalize line endings and strip trailing spaces introduced by the semantic edit.\ns = \"\\n\".join(line.rstrip() for line in s.splitlines()) + \"\\n\"\npath.write_text(s)\nPY\n\n# Build 7: bounded\
        \ Pixel Fold geometry, independent presets, and a working fork updater.\npython3 - <<'PY2'\nfrom pathlib import Path\nimport re, os, textwrap\n\nlayout = Path(\"app/src/main/java/com/mccal/folio/LayoutModel.kt\")\nt = layout.read_text()\n\n# Build 4 is applied immediately above, so patch the exact geometry that\n# now exists in LayoutModel.kt. This avoids guessing at upstream formatting.\nold_geometry = (\n    \"    val topFloor = if (expanded) 30f else 16f\\n\"\n    \"    val baseContentTop = if (p.pageTop) topFloor else ((height - pageHeight - homeBottomSpace) / 2f).coerceIn(topFloor, maxOf(72f, height * .18f))\\n\"\n    \"    // Pixel Fold tuning: this is the actual geometry consumed by Home. Keep the page inside the usable window.\\n\"\n    \"    val contentTop = (baseContentTop + p.pageOffset).coerceIn(topFloor, maxOf(topFloor, height - pageHeight - homeBottomSpace))\"\n)\nnew_geometry = (\n    \"    val topFloor = if (expanded) 30f else 16f\\n\"\n    \"    val usableBottom\
        \ = maxOf(topFloor, height - homeBottomSpace)\\n\"\n    \"    val maxContentTop = maxOf(topFloor, usableBottom - pageHeight)\\n\"\n    \"    val centeredTop = topFloor + ((usableBottom - topFloor - pageHeight) / 2f)\\n\"\n    \"    val baseContentTop = if (p.pageTop) topFloor else centeredTop\\n\"\n    \"    // Pixel Fold Build 7: center the complete Home page in the usable launcher region,\\n\"\n    \"    // then apply the per-display manual correction and clamp the final page bounds.\\n\"\n    \"    val contentTop = (baseContentTop + p.pageOffset).coerceIn(topFloor, maxContentTop)\"\n)\ngeometry_count = t.count(old_geometry)\nif geometry_count != 1:\n    print(\"---- LayoutModel geometry context ----\")\n    marker = t.find(\"val topFloor = if (expanded)\")\n    print(t[max(0, marker - 300): marker + 1200] if marker >= 0 else \"topFloor marker missing\")\n    raise SystemExit(f\"Build 6.2: expected exactly one Build 4 geometry block, found {geometry_count}\")\nt = t.replace(old_geometry,\
        \ new_geometry, 1)\n\n# Expand the saved per-display correction range.\nt, range_count = re.subn(r'pageOffset\\s*=\\s*pageOffset\\.takeIf\\s*\\{\\s*it\\.isFinite\\(\\)\\s*\\}\\?\\.coerceIn\\(\\s*-80f\\s*,\\s*160f\\s*\\)',\n                        'pageOffset = pageOffset.takeIf { it.isFinite() }?.coerceIn(-220f, 220f)', t, count=1)\nif range_count != 1:\n    raise SystemExit(\"Build 6.2: pageOffset sanitization range not found\")\nlayout.write_text(t)\ncs = Path(\"app/src/main/java/com/mccal/folio/CustomizationSheet.kt\")\nt = cs.read_text()\nm = re.search(r'val p\\s*=\\s*if\\s*\\(wide\\)\\s*state\\.expanded\\s*else\\s*state\\.compact', t)\nif not m: raise SystemExit(\"Build 6.2: could not locate Home Screen & Dock preset selector\")\nfun_start = t.rfind('\\n@Composable', 0, m.start())\nif fun_start < 0: fun_start = t.rfind('\\ninternal fun ', 0, m.start())\nbrace = t.find('{', fun_start); depth = 0; fun_end = None\nfor i in range(brace, len(t)):\n    if t[i] == '{': depth += 1\n\
        \    elif t[i] == '}':\n        depth -= 1\n        if depth == 0: fun_end = i + 1; break\nif fun_end is None: raise SystemExit(\"Build 6.2: could not isolate Home Screen & Dock function\")\nbody = t[fun_start:fun_end]\nbody = re.sub(r'val p\\s*=\\s*if\\s*\\(wide\\)\\s*state\\.expanded\\s*else\\s*state\\.compact',\n    'var editWide by remember(wide) { mutableStateOf(wide) }\\n    val p = if (editWide) state.expanded else state.compact', body, count=1)\nbody = body.replace('model.setPreset(wide,', 'model.setPreset(editWide,')\nbody = body.replace('if (wide) \"Pixel Fold Layout \xB7 Inner\" else \"Pixel Fold Layout \xB7 Cover\"', 'if (editWide) \"Pixel Fold Layout \xB7 Inner\" else \"Pixel Fold Layout \xB7 Cover\"')\nheading = 'SettingsCard(if (editWide) \"Pixel Fold Layout \xB7 Inner\" else \"Pixel Fold Layout \xB7 Cover\") {'\nselector = 'SettingsCard(\"Pixel Fold screen\") {\\n        IosMenuRow(\"Edit layout\", listOf(false to \"Cover\", true to \"Inner\"), editWide,\\n      \
        \      { editWide = it }, tag = \"pixel-layout-target\")\\n    }\\n    '\nif heading not in body: raise SystemExit(\"Build 6: Pixel Fold layout card not found\")\nbody = body.replace(heading, selector + heading, 1)\nbody = body.replace('p.pageOffset, -220f..220f, 0f, peek = true)', 'p.pageOffset, -220f..220f, 0f, peek = true)')\nt = t[:fun_start] + body + t[fun_end:]; cs.write_text(t)\n\nglass = Path(\"app/src/main/java/com/mccal/folio/FolioGlass.kt\")\nt = glass.read_text().replace('alpha = .54f', 'alpha = .48f').replace('alpha = .58f', 'alpha = .50f')\nt = t.replace('val secondary = Color.White.copy(alpha = .62f)', 'val secondary = Color.White.copy(alpha = .78f)'); glass.write_text(t)\n\nlib = Path(\"app/src/main/java/com/mccal/folio/AppLibrary.kt\"); t = lib.read_text()\nt = t.replace('Glass.copy(alpha = .16f)', 'Glass.copy(alpha = .12f)').replace('Color.White.copy(alpha = .035f)', 'Color.White.copy(alpha = .025f)')\nt = t.replace('ink = ink, onSearch = {', 'ink = if (glass) Color.White.copy(alpha\
        \ = .94f) else ink, onSearch = {', 1)\nt = t.replace('labelColor = ink, onLaunch =', 'labelColor = if (glass) Color.White.copy(alpha = .88f) else ink, onLaunch ='); lib.write_text(t)\n\nchanged = 0\nfor path in Path('app/src').rglob('*'):\n    if path.suffix not in {'.kt', '.xml', '.java'}: continue\n    try: x = path.read_text()\n    except UnicodeDecodeError: continue\n    y = x.replace('McCal-Codes/folio', 'vNauj/Folio-Pixel').replace('McCal-Codes%2Ffolio', 'vNauj%2FFolio-Pixel')\n    if y != x: path.write_text(y); changed += 1\nprint(f\"Updater repository replacements: {changed} file(s)\")\nif changed == 0: raise SystemExit(\"Build 6: updater repository string was not found\")\n\n# assembleFast intentionally shows Folio's development-update fallback.\n# For this personal fork we still use the fast APK, but opt the Software\n# Update screen into Folio's normal GitHub-release path. Only touch the\n# source file that contains the explicit development fallback message.\nupdater_files\
        \ = []\ndev_phrase = \"It updates from new builds, not GitHub.\"\nfor path in Path('app/src/main/java').rglob('*.kt'):\n    x = path.read_text()\n    if dev_phrase not in x:\n        continue\n    updater_files.append(path)\n    # The fallback is guarded by BuildConfig.DEBUG in upstream Folio.\n    # Force only this updater screen down the normal release branch.\n    y, debug_count = re.subn(r'BuildConfig\\.DEBUG', 'false', x)\n    y = y.replace(dev_phrase, \"Pixel Fold build. Updates are checked from vNauj/Folio-Pixel releases.\")\n    path.write_text(y)\n    print(f\"GitHub updater enabled in {path} (debug guards changed: {debug_count})\")\nif not updater_files:\n    raise SystemExit(\"Build 6: Folio development updater fallback was not found\")\n\n# Build 7 updater contract: the APK's internal version and GitHub release tag\n# MUST be the same semantic version. Upstream derives versionCode from folioVersion.\nrun = int(os.environ['GITHUB_RUN_NUMBER'])\nrelease_version = f\"0.8.{run}\"\
        \ngradle = Path('app/build.gradle.kts')\ng = gradle.read_text()\ng, vc = re.subn(r'val folioVersion\\s*=\\s*\"[^\"]+\"', f'val folioVersion = \"{release_version}\"', g, count=1)\nif vc != 1:\n    raise SystemExit(\"Build 7: could not set folioVersion in app/build.gradle.kts\")\ngradle.write_text(g)\n\n# The fast build uses applicationIdSuffix=.dev. Upstream intentionally disables\n# GitHub updates for that package; this fork intentionally enables them while\n# retaining the stable debug signing key so updates install over Build 7+.\nsu = Path('app/src/main/java/com/mccal/folio/SoftwareUpdate.kt')\nu = su.read_text()\nu, supported_count = re.subn(\n    r'fun supported\\(context: Context\\) = context\\.packageName == FOLIO_CLASSES',\n    'fun supported(context: Context) = context.packageName == FOLIO_CLASSES || context.packageName == \"$FOLIO_CLASSES.dev\"',\n    u, count=1)\nif supported_count != 1:\n    raise SystemExit(\"Build 7: could not enable updater for the fast .dev package\"\
        )\nsu.write_text(u)\nprint(f\"Build 12 version: {release_version}; updater enabled for Folio Dev package\")\n\ncleanup_paths = [layout, cs, glass, lib, su]\ncleanup_paths.append(gradle)\nfor path in cleanup_paths:\n    x = path.read_text(); path.write_text(\"\\n\".join(line.rstrip() for line in x.splitlines()) + \"\\n\")\nPY2\n\n# Build 12: one compact page language for the unfolded screen.\n# Keep Folio's natural widget sizes, but make Home/Today/App Library share\n# a status-aligned page viewport. Do not draw a permanent edge mask.\npython3 - <<'PY12'\nfrom pathlib import Path\n\nhw = Path(\"app/src/main/java/com/mccal/folio/HomeWorkspace.kt\")\ns = hw.read_text()\n\n# Center the natural Home pane in the expanded viewport without stretching widgets.\nold = '    val initialHomeOrigin = with(density) { panelWidth.toPx() }\\n    val homePaneWidth = with(density) { (geometry.gridWidth + 16f).dp.toPx() }'\nnew = '''    val initialHomeOrigin = with(density) { panelWidth.toPx() }\n  \
        \  val homePaneWidth = with(density) { (geometry.gridWidth + 16f).dp.toPx() }\n    // Build 12: page viewport and content size are separate. Natural Folio content stays compact.\n    val adaptiveHomeOrigin = if (geometry.expanded) {\n        ((viewportWidth - homePaneWidth) / 2f).coerceAtLeast(initialHomeOrigin)\n    } else initialHomeOrigin'''\nif old not in s: raise SystemExit(\"Build 12: expanded origin block not found\")\ns = s.replace(old, new, 1)\ns = s.replace('val start = initialHomeOrigin + page * stride', 'val start = adaptiveHomeOrigin + page * stride', 1)\ns = s.replace('val leadingX = initialHomeOrigin - stride', 'val leadingX = adaptiveHomeOrigin - stride', 1)\ns = s.replace('Modifier.place(initialHomeOrigin + page * stride)', 'Modifier.place(adaptiveHomeOrigin + page * stride)', 1)\n\n# Today View: same compact page, with its top aligned to the status/time bubble.\ntoday = 'if (besideContent != null) besideContent(Modifier.fillMaxSize()) else HomePagePane('\ntoday_new\
        \ = 'if (besideContent != null) besideContent(Modifier.fillMaxSize().padding(top = geometry.statusTop.dp, bottom = bottomSpace)) else HomePagePane('\nif today not in s: raise SystemExit(\"Build 12: Today View host not found\")\ns = s.replace(today, today_new, 1)\n\n# App Library: make it a compact page rather than a full-screen expanded window.\nlibrary_host = 'Box(Modifier.place((visibleHomePages - 1) * stride + viewportWidth).fillMaxSize()) {'\nlibrary_host_new = 'Box(Modifier.place((visibleHomePages - 1) * stride + viewportWidth).width((geometry.gridWidth + 16f).dp).fillMaxHeight()) {'\nif library_host not in s: raise SystemExit(\"Build 12: App Library host not found\")\ns = s.replace(library_host, library_host_new, 1)\ns = s.replace('.padding(start = 16.dp, top = 16.dp, bottom = bottomSpace)', '.padding(start = 16.dp, top = geometry.statusTop.dp, bottom = bottomSpace)', 1)\nhw.write_text(s)\n\n# Inner Home: four app rows. Cover retains Folio's normal phone row behavior.\nlm =\
        \ Path(\"app/src/main/java/com/mccal/folio/LayoutModel.kt\")\nl = lm.read_text()\nrows_old = '    val rows = appRows.coerceIn(BASE_APP_ROWS, MAX_APP_ROWS)'\nrows_new = '    val rows = if (expanded) minOf(appRows.coerceIn(BASE_APP_ROWS, MAX_APP_ROWS), 4) else appRows.coerceIn(BASE_APP_ROWS, MAX_APP_ROWS)'\nif rows_old not in l: raise SystemExit(\"Build 12: row calculation not found\")\nl = l.replace(rows_old, rows_new, 1)\n\n# Expanded mode honors the Y slider directly; cover keeps the safety clamp.\ntop_old = '    val contentTop = (baseContentTop + p.pageOffset).coerceIn(topFloor, maxContentTop)'\ntop_new = '    val contentTop = if (expanded) (baseContentTop + p.pageOffset).coerceAtLeast(topFloor) else (baseContentTop + p.pageOffset).coerceIn(topFloor, maxContentTop)'\nif top_old not in l: raise SystemExit(\"Build 12: contentTop clamp not found\")\nl = l.replace(top_old, top_new, 1)\nlm.write_text(l)\n\n# App Library stays Duo/cover-like: compact and two columns when unfolded.\n\
        lib = Path(\"app/src/main/java/com/mccal/folio/AppLibrary.kt\")\na = lib.read_text()\n# The Build 11 source does not contain a separate panel-width helper here;\n# the compact page width is established by HomeWorkspace above. Keep the\n# category grid itself explicitly two columns on both Cover and Inner.\ncols_old = 'val columns = libraryColumns(libraryWidth.value)'\ncols_new = 'val columns = 2'\nif cols_old not in a: raise SystemExit(\"Build 12: library columns calculation not found\")\na = a.replace(cols_old, cols_new, 1)\nlib.write_text(a)\n\nprint(\"Build 12: compact natural Home pane centered without widget stretching\")\nprint(\"Build 12: Inner Home limited to four app rows; Home vertical offset works in expanded mode\")\nprint(\"Build 12: Today and App Library top-align to the status bubble\")\nprint(\"Build 12: App Library is a compact two-column page; permanent blue edge fade removed\")\nPY12\n\n# Build 13: fixed six-row Home grid on both displays, no vertical Home scrolling,\n\
        # higher page anchor, and one-pane-at-a-time expanded paging.\npython3 - <<'PY13'\nfrom pathlib import Path\n\nhw = Path(\"app/src/main/java/com/mccal/folio/HomeWorkspace.kt\")\ns = hw.read_text()\n\n# Home/Today are fixed pages. App Library keeps its own LazyColumn scrolling.\nscroll = '.fillMaxHeight()\\n            .verticalScroll(homeScroll).padding(top = geometry.contentTop.dp + editRoom, bottom = 8.dp)'\nfixed = '.fillMaxHeight()\\n            .padding(top = geometry.contentTop.dp + editRoom, bottom = 8.dp)'\nif scroll not in s: raise SystemExit(\"Build 13: Home verticalScroll chain not found\")\ns = s.replace(scroll, fixed, 1)\n\n# Expanded Fold shows two adjacent panes. Advance by exactly one pane width, not a full viewport.\n# Keep cover behavior untouched.\nstride_old = 'val stride = viewportWidth'\nif stride_old in s:\n    s = s.replace(stride_old, 'val stride = if (geometry.expanded) with(density) { (geometry.gridWidth + 16f).dp.toPx() } else viewportWidth', 1)\nelse:\n\
        \    # Some upstream revisions derive stride from pageWidth; patch the first simple assignment only.\n    import re\n    s, n = re.subn(r'val stride = [^\\n]+', 'val stride = if (geometry.expanded) with(density) { (geometry.gridWidth + 16f).dp.toPx() } else viewportWidth', s, count=1)\n    if n != 1: raise SystemExit(\"Build 13: pager stride assignment not found\")\n\n# Build 13.1 sanity check: stride is declared before homePaneWidth in upstream,\n# so it must not reference that later local variable.\nstride_line = next((line for line in s.splitlines() if line.strip().startswith(\"val stride =\")), \"\")\nif \"homePaneWidth\" in stride_line:\n    raise SystemExit(\"Build 13.1: pager stride still references homePaneWidth before declaration\")\nif \"geometry.gridWidth + 16f\" not in stride_line:\n    raise SystemExit(\"Build 13.1: compact expanded pager stride was not installed\")\n\nhw.write_text(s)\n\nlm = Path(\"app/src/main/java/com/mccal/folio/LayoutModel.kt\")\nl = lm.read_text()\n\
        \n# Six total Home rows on Cover and Inner. Two rows can be consumed by a 2x2 widget,\n# leaving four app rows in the common layout.\nold_rows = 'val rows = if (expanded) minOf(appRows.coerceIn(BASE_APP_ROWS, MAX_APP_ROWS), 4) else appRows.coerceIn(BASE_APP_ROWS, MAX_APP_ROWS)'\nnew_rows = 'val rows = 6'\nif old_rows not in l: raise SystemExit(\"Build 13: Build 12 row rule not found\")\nl = l.replace(old_rows, new_rows, 1)\n\n# Move the fixed page region upward on both displays. This becomes the automatic baseline;\n# the existing per-display pageOffset remains an optional fine adjustment.\nold_base = 'val baseContentTop = if (p.pageTop) topFloor else centeredTop'\nnew_base = 'val baseContentTop = if (p.pageTop) topFloor else maxOf(topFloor, centeredTop - if (expanded) 82f else 54f)'\nif old_base not in l: raise SystemExit(\"Build 13: centered top baseline not found\")\nl = l.replace(old_base, new_base, 1)\nlm.write_text(l)\n\nprint(\"Build 13: Home fixed at 4 columns x 6 rows on\
        \ Cover and Inner\")\nprint(\"Build 13: Home vertical scrolling removed; App Library remains vertically scrollable\")\nprint(\"Build 13.1: expanded pager advances one compact pane per swipe without forward-reference compile error\")\nprint(\"Build 13: page baseline shifted upward; manual per-display offset preserved\")\nPY13\n\n\n# Build 14: real 4x6 Home grid, normalized page strip, and bubbled Today View.\npython3 - <<'PY14'\nfrom pathlib import Path\n\nlm = Path(\"app/src/main/java/com/mccal/folio/LayoutModel.kt\")\nl = lm.read_text()\nif \"val rows = 6\" not in l:\n    raise SystemExit(\"Build 14: Build 13 six-app-row rule not found\")\n# `rows` counts app rows; Folio separately reserves two widget half-rows.\n# 4 app rows + 2 widget rows = the requested 4x6 total grid.\nl = l.replace(\"val rows = 6\", \"val rows = 4\", 1)\nlm.write_text(l)\n\nhw = Path(\"app/src/main/java/com/mccal/folio/HomeWorkspace.kt\")\nh = hw.read_text()\n\n# Today is the true leading pane instead of inheriting\
        \ the old centered Home origin.\nold_leading = \"val leadingX = adaptiveHomeOrigin - stride\"\nif old_leading not in h:\n    raise SystemExit(\"Build 14: expanded Today origin not found\")\nh = h.replace(old_leading, \"val leadingX = with(density) { 16.dp.toPx() }\", 1)\n\n# Library follows however many Home pages currently exist.\nold_library = \"Box(Modifier.place((visibleHomePages - 1) * stride + viewportWidth).width((geometry.gridWidth + 16f).dp).fillMaxHeight()) {\"\nnew_library = \"Box(Modifier.place(adaptiveHomeOrigin + visibleHomePages * stride).width((geometry.gridWidth + 16f).dp).fillMaxHeight()) {\"\nif old_library not in h:\n    raise SystemExit(\"Build 14: compact App Library placement not found\")\nh = h.replace(old_library, new_library, 1)\nhw.write_text(h)\n\ntv = Path(\"app/src/main/java/com/mccal/folio/TodayView.kt\")\nt = tv.read_text()\n\nold_context = \"    val context = LocalContext.current\\n    val edit = remember { HomeEditMode() }\"\nnew_context = \"   \
        \ val context = LocalContext.current\\n    val todayPrefs = remember(context) { context.getSharedPreferences(\\\"folio_today\\\", android.content.Context.MODE_PRIVATE) }\\n    var showSuggestions by remember { mutableStateOf(todayPrefs.getBoolean(\\\"show_suggestions\\\", true)) }\\n    val edit = remember { HomeEditMode() }\"\nif old_context not in t:\n    raise SystemExit(\"Build 14: Today context block not found\")\nt = t.replace(old_context, new_context, 1)\n\nold_box = '        BoxWithConstraints(modifier.testTag(\"today-view\")) {'\nnew_box = '        BoxWithConstraints(modifier\\\\n            .clip(RoundedCornerShape(24.dp))\\\\n            .background(Glass.copy(alpha = .30f))\\\\n            .border(FolioGlass.edge, RoundedCornerShape(24.dp))\\\\n            .testTag(\"today-view\")) {'\nif old_box not in t:\n    raise SystemExit(\"Build 14: Today outer box not found\")\nt = t.replace(old_box, new_box.replace(\"\\\\\\\\n\", \"\\n\"), 1)\n\nold_grid = \"            val columnsWidth\
        \ = minOf(maxWidth - 32.dp, 390.dp)\\n            val gap = 14.dp\\n            val cell = (columnsWidth - gap) / 2\"\nnew_grid = \"            val columnsWidth = (maxWidth - 32.dp).coerceAtLeast(240.dp)\\n            val gap = 10.dp\\n            val cell = (columnsWidth - gap * 3) / 4\"\nif old_grid not in t:\n    raise SystemExit(\"Build 14: Today grid dimensions not found\")\nt = t.replace(old_grid, new_grid, 1)\n\nold_suggestions = \"                    if (suggestions.isNotEmpty() && !edit.active) TodaySuggestions(suggestions, 4, onLaunch)\"\nif old_suggestions not in t:\n    raise SystemExit(\"Build 14: Today Suggestions call not found\")\nt = t.replace(old_suggestions, \"                    if (showSuggestions && suggestions.isNotEmpty() && !edit.active) TodaySuggestions(suggestions, 4, onLaunch)\", 1)\n\nold_width = \"                                val width = if (widget.size.columns == 2) columnsWidth else cell\"\nif old_width not in t:\n    raise SystemExit(\"Build 14:\
