    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Reuse development signing key
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: folio-pixel-development-key-v1
    - name: Build Pixel Fold APK
      shell: bash
      run: 'chmod +x gradlew

        ./gradlew --no-daemon :app:assembleFast

        '
    - name: Run unit tests
      continue-on-error: true
      shell: bash
      run: ./gradlew --no-daemon :app:testDebugUnitTest
    - name: Run lint
      continue-on-error: true
      shell: bash
      run: ./gradlew --no-daemon :app:lintDebug
    - name: Prepare APK
      shell: bash
      run: 'mkdir -p output

        cp app/build/outputs/apk/fast/app-fast.apk output/Folio-Pixel-Fold.apk

        (cd output && sha256sum Folio-Pixel-Fold.apk > SHA256SUMS.txt)

        '
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Folio-Pixel-Fold-APK
        path: output/
        if-no-files-found: error
        retention-days: 30
    - name: Publish latest Pixel Fold release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: "VERSION=\"0.8.${GITHUB_RUN_NUMBER}\"\nTAG=\"v${VERSION}\"\ngh release create \"$TAG\" output/Folio-Pixel-Fold.apk output/SHA256SUMS.txt \\\n  --repo vNauj/Folio-Pixel \\\n  --title \"Folio Pixel Fold ${VERSION}\" \\\n  --notes \"Pixel Fold Build 14.5 Shared Pane Bounds ${VERSION}. Uses one shared Home-referenced two-slot coordinate system for Today, Home, and App Library on Inner while preserving one-pane paging, Cover behavior, Home persistence, and the five-icon dock.\" \\\n  --latest\n"
