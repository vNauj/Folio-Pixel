name: "Build Pixel Fold APK · Build 14.7 Full Two-Slot"
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pixel-fold-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Fetch exact Folio source
      uses: actions/checkout@v4
      with:
        repository: McCal-Codes/folio
        ref: 9f38861fb7d8c89896a6db0c762fd988acfc45f2
        persist-credentials: false
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
    - name: Install Android SDK 36
      shell: bash
      run: |
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager "platforms;android-36" "build-tools;36.0.0"
    - name: Apply Pixel Fold Build 6.2
      shell: bash
      env:
        PATCH_B64: 
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import base64, os, pathlib
        pathlib.Path("/tmp/folio-build4.patch").write_bytes(
            base64.b64decode(os.environ["PATCH_B64"])
        )
        PY

        git apply --check /tmp/folio-build4.patch
        git apply /tmp/folio-build4.patch

        # CustomizationSheet is edited semantically instead of by line-number
        # patching. This avoids the conflict that stopped the previous build.
        python3 - <<'PY'
        from pathlib import Path
        import re

        path = Path("app/src/main/java/com/mccal/folio/CustomizationSheet.kt")
        s = path.read_text()

        # Rename the Position card without depending on its line number.
        if 'SettingsCard("Position")' in s:
            s = s.replace(
                'SettingsCard("Position")',
                'SettingsCard(if (wide) "Pixel Fold Layout · Inner" else "Pixel Fold Layout · Cover")',
                1
            )

        # Add the independent vertical Home control immediately after Apps.
        if '"Home vertical position"' not in s:
            pattern = re.compile(
                r'(IosMenuRow\("Apps",\s*listOf\(false to "Centered", true to "Top"\),\s*p\.pageTop,\s*'
                r'\{ model\.setPreset\(wide, p\.copy\(pageTop = it\)\) \},\s*tag = "page-position"\)\s*)'
            )
            replacement = (
                r'\1'
                '\n        CustomizationSlider("Home vertical position", '
                'if (p.pageOffset == 0f) "Default" else "${p.pageOffset.toInt()} dp",\n'
                '            p.pageOffset, -220f..220f, 0f, peek = true) '
                '{ model.setPreset(wide, p.copy(pageOffset = it)) }\n'
            )
            s, count = pattern.subn(replacement, s, count=1)
            if count != 1:
                raise SystemExit("Could not locate Apps position control in CustomizationSheet.kt")

        s = s.replace('"Dock height"', '"Dock vertical position"')
        # Normalize line endings and strip trailing spaces introduced by the semantic edit.
        s = "\n".join(line.rstrip() for line in s.splitlines()) + "\n"
        path.write_text(s)
        PY

        # Build 7: bounded Pixel Fold geometry, independent presets, and a working fork updater.
        python3 - <<'PY2'
        from pathlib import Path
        import re, os, textwrap

        layout = Path("app/src/main/java/com/mccal/folio/LayoutModel.kt")
        t = layout.read_text()

        # Build 4 is applied immediately above, so patch the exact geometry that
        # now exists in LayoutModel.kt. This avoids guessing at upstream formatting.
        old_geometry = (
            "    val topFloor = if (expanded) 30f else 16f\n"
            "    val baseContentTop = if (p.pageTop) topFloor else ((height - pageHeight - homeBottomSpace) / 2f).coerceIn(topFloor, maxOf(72f, height * .18f))\n"
            "    // Pixel Fold tuning: this is the actual geometry consumed by Home. Keep the page inside the usable window.\n"
            "    val contentTop = (baseContentTop + p.pageOffset).coerceIn(topFloor, maxOf(topFloor, height - pageHeight - homeBottomSpace))"
        )
        new_geometry = (
            "    val topFloor = if (expanded) 30f else 16f\n"
            "    val usableBottom = maxOf(topFloor, height - homeBottomSpace)\n"
            "    val maxContentTop = maxOf(topFloor, usableBottom - pageHeight)\n"
            "    val centeredTop = topFloor + ((usableBottom - topFloor - pageHeight) / 2f)\n"
            "    val baseContentTop = if (p.pageTop) topFloor else centeredTop\n"
            "    // Pixel Fold Build 7: center the complete Home page in the usable launcher region,\n"
            "    // then apply the per-display manual correction and clamp the final page bounds.\n"
            "    val contentTop = (baseContentTop + p.pageOffset).coerceIn(topFloor, maxContentTop)"
        )
        geometry_count = t.count(old_geometry)
        if geometry_count != 1:
            print("---- LayoutModel geometry context ----")
            marker = t.find("val topFloor = if (expanded)")
            print(t[max(0, marker - 300): marker + 1200] if marker >= 0 else "topFloor marker missing")
            raise SystemExit(f"Build 6.2: expected exactly one Build 4 geometry block, found {geometry_count}")
        t = t.replace(old_geometry, new_geometry, 1)

        # Expand the saved per-display correction range.
        t, range_count = re.subn(r'pageOffset\s*=\s*pageOffset\.takeIf\s*\{\s*it\.isFinite\(\)\s*\}\?\.coerceIn\(\s*-80f\s*,\s*160f\s*\)',
                                'pageOffset = pageOffset.takeIf { it.isFinite() }?.coerceIn(-220f, 220f)', t, count=1)
        if range_count != 1:
            raise SystemExit("Build 6.2: pageOffset sanitization range not found")
        layout.write_text(t)
        cs = Path("app/src/main/java/com/mccal/folio/CustomizationSheet.kt")
        t = cs.read_text()
        m = re.search(r'val p\s*=\s*if\s*\(wide\)\s*state\.expanded\s*else\s*state\.compact', t)
        if not m: raise SystemExit("Build 6.2: could not locate Home Screen & Dock preset selector")
        fun_start = t.rfind('\n@Composable', 0, m.start())
        if fun_start < 0: fun_start = t.rfind('\ninternal fun ', 0, m.start())
        brace = t.find('{', fun_start); depth = 0; fun_end = None
        for i in range(brace, len(t)):
            if t[i] == '{': depth += 1
            elif t[i] == '}':
                depth -= 1
                if depth == 0: fun_end = i + 1; break
        if fun_end is None: raise SystemExit("Build 6.2: could not isolate Home Screen & Dock function")
        body = t[fun_start:fun_end]
        body = re.sub(r'val p\s*=\s*if\s*\(wide\)\s*state\.expanded\s*else\s*state\.compact',
            'var editWide by remember(wide) { mutableStateOf(wide) }\n    val p = if (editWide) state.expanded else state.compact', body, count=1)
        body = body.replace('model.setPreset(wide,', 'model.setPreset(editWide,')
        body = body.replace('if (wide) "Pixel Fold Layout · Inner" else "Pixel Fold Layout · Cover"', 'if (editWide) "Pixel Fold Layout · Inner" else "Pixel Fold Layout · Cover"')
        heading = 'SettingsCard(if (editWide) "Pixel Fold Layout · Inner" else "Pixel Fold Layout · Cover") {'
        selector = 'SettingsCard("Pixel Fold screen") {\n        IosMenuRow("Edit layout", listOf(false to "Cover", true to "Inner"), editWide,\n            { editWide = it }, tag = "pixel-layout-target")\n    }\n    '
        if heading not in body: raise SystemExit("Build 6: Pixel Fold layout card not found")
        body = body.replace(heading, selector + heading, 1)
        body = body.replace('p.pageOffset, -220f..220f, 0f, peek = true)', 'p.pageOffset, -220f..220f, 0f, peek = true)')
        t = t[:fun_start] + body + t[fun_end:]; cs.write_text(t)

        glass = Path("app/src/main/java/com/mccal/folio/FolioGlass.kt")
        t = glass.read_text().replace('alpha = .54f', 'alpha = .48f').replace('alpha = .58f', 'alpha = .50f')
        t = t.replace('val secondary = Color.White.copy(alpha = .62f)', 'val secondary = Color.White.copy(alpha = .78f)'); glass.write_text(t)

        lib = Path("app/src/main/java/com/mccal/folio/AppLibrary.kt"); t = lib.read_text()
        t = t.replace('Glass.copy(alpha = .16f)', 'Glass.copy(alpha = .12f)').replace('Color.White.copy(alpha = .035f)', 'Color.White.copy(alpha = .025f)')
        t = t.replace('ink = ink, onSearch = {', 'ink = if (glass) Color.White.copy(alpha = .94f) else ink, onSearch = {', 1)
        t = t.replace('labelColor = ink, onLaunch =', 'labelColor = if (glass) Color.White.copy(alpha = .88f) else ink, onLaunch ='); lib.write_text(t)

        changed = 0
        for path in Path('app/src').rglob('*'):
            if path.suffix not in {'.kt', '.xml', '.java'}: continue
            try: x = path.read_text()
            except UnicodeDecodeError: continue
            y = x.replace('McCal-Codes/folio', 'vNauj/Folio-Pixel').replace('McCal-Codes%2Ffolio', 'vNauj%2FFolio-Pixel')
            if y != x: path.write_text(y); changed += 1
        print(f"Updater repository replacements: {changed} file(s)")
        if changed == 0: raise SystemExit("Build 6: updater repository string was not found")

        # assembleFast intentionally shows Folio's development-update fallback.
        # For this personal fork we still use the fast APK, but opt the Software
        # Update screen into Folio's normal GitHub-release path. Only touch the
        # source file that contains the explicit development fallback message.
        updater_files = []
        dev_phrase = "It updates from new builds, not GitHub."
        for path in Path('app/src/main/java').rglob('*.kt'):
            x = path.read_text()
            if dev_phrase not in x:
                continue
            updater_files.append(path)
            # The fallback is guarded by BuildConfig.DEBUG in upstream Folio.
            # Force only this updater screen down the normal release branch.
            y, debug_count = re.subn(r'BuildConfig\.DEBUG', 'false', x)
            y = y.replace(dev_phrase, "Pixel Fold build. Updates are checked from vNauj/Folio-Pixel releases.")
            path.write_text(y)
            print(f"GitHub updater enabled in {path} (debug guards changed: {debug_count})")
        if not updater_files:
            raise SystemExit("Build 6: Folio development updater fallback was not found")

        # Build 7 updater contract: the APK's internal version and GitHub release tag
        # MUST be the same semantic version. Upstream derives versionCode from folioVersion.
        run = int(os.environ['GITHUB_RUN_NUMBER'])
        release_version = f"0.8.{run}"
        gradle = Path('app/build.gradle.kts')
        g = gradle.read_text()
        g, vc = re.subn(r'val folioVersion\s*=\s*"[^"]+"', f'val folioVersion = "{release_version}"', g, count=1)
        if vc != 1:
            raise SystemExit("Build 7: could not set folioVersion in app/build.gradle.kts")
        gradle.write_text(g)

        # The fast build uses applicationIdSuffix=.dev. Upstream intentionally disables
        # GitHub updates for that package; this fork intentionally enables them while
        # retaining the stable debug signing key so updates install over Build 7+.
        su = Path('app/src/main/java/com/mccal/folio/SoftwareUpdate.kt')
        u = su.read_text()
        u, supported_count = re.subn(
            r'fun supported\(context: Context\) = context\.packageName == FOLIO_CLASSES',
            'fun supported(context: Context) = context.packageName == FOLIO_CLASSES || context.packageName == "$FOLIO_CLASSES.dev"',
            u, count=1)
        if supported_count != 1:
            raise SystemExit("Build 7: could not enable updater for the fast .dev package")
        su.write_text(u)
        print(f"Build 12 version: {release_version}; updater enabled for Folio Dev package")

        cleanup_paths = [layout, cs, glass, lib, su]
        cleanup_paths.append(gradle)
        for path in cleanup_paths:
            x = path.read_text(); path.write_text("\n".join(line.rstrip() for line in x.splitlines()) + "\n")
        PY2

        # Build 12: one compact page language for the unfolded screen.
        # Keep Folio's natural widget sizes, but make Home/Today/App Library share
        # a status-aligned page viewport. Do not draw a permanent edge mask.
        python3 - <<'PY12'
        from pathlib import Path

        hw = Path("app/src/main/java/com/mccal/folio/HomeWorkspace.kt")
        s = hw.read_text()

        # Center the natural Home pane in the expanded viewport without stretching widgets.
        old = '    val initialHomeOrigin = with(density) { panelWidth.toPx() }\n    val homePaneWidth = with(density) { (geometry.gridWidth + 16f).dp.toPx() }'
        new = '''    val initialHomeOrigin = with(density) { panelWidth.toPx() }
            val homePaneWidth = with(density) { (geometry.gridWidth + 16f).dp.toPx() }
            // Build 12: page viewport and content size are separate. Natural Folio content stays compact.
            val adaptiveHomeOrigin = if (geometry.expanded) {
                ((viewportWidth - homePaneWidth) / 2f).coerceAtLeast(initialHomeOrigin)
            } else initialHomeOrigin'''
        if old not in s: raise SystemExit("Build 12: expanded origin block not found")
        s = s.replace(old, new, 1)
        s = s.replace('val start = initialHomeOrigin + page * stride', 'val start = adaptiveHomeOrigin + page * stride', 1)
        s = s.replace('val leadingX = initialHomeOrigin - stride', 'val leadingX = adaptiveHomeOrigin - stride', 1)
        s = s.replace('Modifier.place(initialHomeOrigin + page * stride)', 'Modifier.place(adaptiveHomeOrigin + page * stride)', 1)

        # Today View: same compact page, with its top aligned to the status/time bubble.
        today = 'if (besideContent != null) besideContent(Modifier.fillMaxSize()) else HomePagePane('
        today_new = 'if (besideContent != null) besideContent(Modifier.fillMaxSize().padding(top = geometry.statusTop.dp, bottom = bottomSpace)) else HomePagePane('
        if today not in s: raise SystemExit("Build 12: Today View host not found")
        s = s.replace(today, today_new, 1)

        # App Library: make it a compact page rather than a full-screen expanded window.
        library_host = 'Box(Modifier.place((visibleHomePages - 1) * stride + viewportWidth).fillMaxSize()) {'
        library_host_new = 'Box(Modifier.place((visibleHomePages - 1) * stride + viewportWidth).width((geometry.gridWidth + 16f).dp).fillMaxHeight()) {'
        if library_host not in s: raise SystemExit("Build 12: App Library host not found")
        s = s.replace(library_host, library_host_new, 1)
        s = s.replace('.padding(start = 16.dp, top = 16.dp, bottom = bottomSpace)', '.padding(start = 16.dp, top = geometry.statusTop.dp, bottom = bottomSpace)', 1)
        hw.write_text(s)

        # Inner Home: four app rows. Cover retains Folio's normal phone row behavior.
        lm = Path("app/src/main/java/com/mccal/folio/LayoutModel.kt")
        l = lm.read_text()
        rows_old = '    val rows = appRows.coerceIn(BASE_APP_ROWS, MAX_APP_ROWS)'
        rows_new = '    val rows = if (expanded) minOf(appRows.coerceIn(BASE_APP_ROWS, MAX_APP_ROWS), 4) else appRows.coerceIn(BASE_APP_ROWS, MAX_APP_ROWS)'
        if rows_old not in l: raise SystemExit("Build 12: row calculation not found")
        l = l.replace(rows_old, rows_new, 1)

        # Expanded mode honors the Y slider directly; cover keeps the safety clamp.
        top_old = '    val contentTop = (baseContentTop + p.pageOffset).coerceIn(topFloor, maxContentTop)'
        top_new = '    val contentTop = if (expanded) (baseContentTop + p.pageOffset).coerceAtLeast(topFloor) else (baseContentTop + p.pageOffset).coerceIn(topFloor, maxContentTop)'
        if top_old not in l: raise SystemExit("Build 12: contentTop clamp not found")
        l = l.replace(top_old, top_new, 1)
        lm.write_text(l)

        # App Library stays Duo/cover-like: compact and two columns when unfolded.
        lib = Path("app/src/main/java/com/mccal/folio/AppLibrary.kt")
        a = lib.read_text()
        # The Build 11 source does not contain a separate panel-width helper here;
        # the compact page width is established by HomeWorkspace above. Keep the
        # category grid itself explicitly two columns on both Cover and Inner.
        cols_old = 'val columns = libraryColumns(libraryWidth.value)'
        cols_new = 'val columns = 2'
        if cols_old not in a: raise SystemExit("Build 12: library columns calculation not found")
        a = a.replace(cols_old, cols_new, 1)
        lib.write_text(a)

        print("Build 12: compact natural Home pane centered without widget stretching")
        print("Build 12: Inner Home limited to four app rows; Home vertical offset works in expanded mode")
        print("Build 12: Today and App Library top-align to the status bubble")
        print("Build 12: App Library is a compact two-column page; permanent blue edge fade removed")
        PY12

        # Build 13: fixed six-row Home grid on both displays, no vertical Home scrolling,
        # higher page anchor, and one-pane-at-a-time expanded paging.
        python3 - <<'PY13'
        from pathlib import Path

        hw = Path("app/src/main/java/com/mccal/folio/HomeWorkspace.kt")
        s = hw.read_text()

        # Home/Today are fixed pages. App Library keeps its own LazyColumn scrolling.
        scroll = '.fillMaxHeight()\n            .verticalScroll(homeScroll).padding(top = geometry.contentTop.dp + editRoom, bottom = 8.dp)'
        fixed = '.fillMaxHeight()\n            .padding(top = geometry.contentTop.dp + editRoom, bottom = 8.dp)'
        if scroll not in s: raise SystemExit("Build 13: Home verticalScroll chain not found")
        s = s.replace(scroll, fixed, 1)

        # Expanded Fold shows two adjacent panes. Advance by exactly one pane width, not a full viewport.
        # Keep cover behavior untouched.
        stride_old = 'val stride = viewportWidth'
        if stride_old in s:
            s = s.replace(stride_old, 'val stride = if (geometry.expanded) with(density) { (geometry.gridWidth + 16f).dp.toPx() } else viewportWidth', 1)
        else:
            # Some upstream revisions derive stride from pageWidth; patch the first simple assignment only.
            import re
            s, n = re.subn(r'val stride = [^\n]+', 'val stride = if (geometry.expanded) with(density) { (geometry.gridWidth + 16f).dp.toPx() } else viewportWidth', s, count=1)
            if n != 1: raise SystemExit("Build 13: pager stride assignment not found")

        # Build 13.1 sanity check: stride is declared before homePaneWidth in upstream,
        # so it must not reference that later local variable.
        stride_line = next((line for line in s.splitlines() if line.strip().startswith("val stride =")), "")
        if "homePaneWidth" in stride_line:
            raise SystemExit("Build 13.1: pager stride still references homePaneWidth before declaration")
        if "geometry.gridWidth + 16f" not in stride_line:
            raise SystemExit("Build 13.1: compact expanded pager stride was not installed")

        hw.write_text(s)

        lm = Path("app/src/main/java/com/mccal/folio/LayoutModel.kt")
        l = lm.read_text()

        # Six total Home rows on Cover and Inner. Two rows can be consumed by a 2x2 widget,
        # leaving four app rows in the common layout.
        old_rows = 'val rows = if (expanded) minOf(appRows.coerceIn(BASE_APP_ROWS, MAX_APP_ROWS), 4) else appRows.coerceIn(BASE_APP_ROWS, MAX_APP_ROWS)'
        new_rows = 'val rows = 6'
        if old_rows not in l: raise SystemExit("Build 13: Build 12 row rule not found")
        l = l.replace(old_rows, new_rows, 1)

        # Move the fixed page region upward on both displays. This becomes the automatic baseline;
        # the existing per-display pageOffset remains an optional fine adjustment.
        old_base = 'val baseContentTop = if (p.pageTop) topFloor else centeredTop'
        new_base = 'val baseContentTop = if (p.pageTop) topFloor else maxOf(topFloor, centeredTop - if (expanded) 82f else 54f)'
        if old_base not in l: raise SystemExit("Build 13: centered top baseline not found")
        l = l.replace(old_base, new_base, 1)
        lm.write_text(l)

        print("Build 13: Home fixed at 4 columns x 6 rows on Cover and Inner")
        print("Build 13: Home vertical scrolling removed; App Library remains vertically scrollable")
        print("Build 13.1: expanded pager advances one compact pane per swipe without forward-reference compile error")
        print("Build 13: page baseline shifted upward; manual per-display offset preserved")
        PY13


        # Build 14: real 4x6 Home grid, normalized page strip, and bubbled Today View.
        python3 - <<'PY14'
        from pathlib import Path

        lm = Path("app/src/main/java/com/mccal/folio/LayoutModel.kt")
        l = lm.read_text()
        if "val rows = 6" not in l:
            raise SystemExit("Build 14: Build 13 six-app-row rule not found")
        # `rows` counts app rows; Folio separately reserves two widget half-rows.
        # 4 app rows + 2 widget rows = the requested 4x6 total grid.
        l = l.replace("val rows = 6", "val rows = 4", 1)
        lm.write_text(l)

        hw = Path("app/src/main/java/com/mccal/folio/HomeWorkspace.kt")
        h = hw.read_text()

        # Today is the true leading pane instead of inheriting the old centered Home origin.
        old_leading = "val leadingX = adaptiveHomeOrigin - stride"
        if old_leading not in h:
            raise SystemExit("Build 14: expanded Today origin not found")
        h = h.replace(old_leading, "val leadingX = with(density) { 16.dp.toPx() }", 1)

        # Library follows however many Home pages currently exist.
        old_library = "Box(Modifier.place((visibleHomePages - 1) * stride + viewportWidth).width((geometry.gridWidth + 16f).dp).fillMaxHeight()) {"
        new_library = "Box(Modifier.place(adaptiveHomeOrigin + visibleHomePages * stride).width((geometry.gridWidth + 16f).dp).fillMaxHeight()) {"
        if old_library not in h:
            raise SystemExit("Build 14: compact App Library placement not found")
        h = h.replace(old_library, new_library, 1)
        hw.write_text(h)

        tv = Path("app/src/main/java/com/mccal/folio/TodayView.kt")
        t = tv.read_text()

        old_context = "    val context = LocalContext.current\n    val edit = remember { HomeEditMode() }"
        new_context = "    val context = LocalContext.current\n    val todayPrefs = remember(context) { context.getSharedPreferences(\"folio_today\", android.content.Context.MODE_PRIVATE) }\n    var showSuggestions by remember { mutableStateOf(todayPrefs.getBoolean(\"show_suggestions\", true)) }\n    val edit = remember { HomeEditMode() }"
        if old_context not in t:
            raise SystemExit("Build 14: Today context block not found")
        t = t.replace(old_context, new_context, 1)

        old_box = '        BoxWithConstraints(modifier.testTag("today-view")) {'
        new_box = '        BoxWithConstraints(modifier\\n            .clip(RoundedCornerShape(24.dp))\\n            .background(Glass.copy(alpha = .30f))\\n            .border(FolioGlass.edge, RoundedCornerShape(24.dp))\\n            .testTag("today-view")) {'
        if old_box not in t:
            raise SystemExit("Build 14: Today outer box not found")
        t = t.replace(old_box, new_box.replace("\\\\n", "\n"), 1)

        old_grid = "            val columnsWidth = minOf(maxWidth - 32.dp, 390.dp)\n            val gap = 14.dp\n            val cell = (columnsWidth - gap) / 2"
        new_grid = "            val columnsWidth = (maxWidth - 32.dp).coerceAtLeast(240.dp)\n            val gap = 10.dp\n            val cell = (columnsWidth - gap * 3) / 4"
        if old_grid not in t:
            raise SystemExit("Build 14: Today grid dimensions not found")
        t = t.replace(old_grid, new_grid, 1)

        old_suggestions = "                    if (suggestions.isNotEmpty() && !edit.active) TodaySuggestions(suggestions, 4, onLaunch)"
        if old_suggestions not in t:
            raise SystemExit("Build 14: Today Suggestions call not found")
        t = t.replace(old_suggestions, "                    if (showSuggestions && suggestions.isNotEmpty() && !edit.active) TodaySuggestions(suggestions, 4, onLaunch)", 1)

        old_width = "                                val width = if (widget.size.columns == 2) columnsWidth else cell"
        if old_width not in t:
            raise SystemExit("Build 14: Today widget width rule not found")
        t = t.replace(old_width, "                                val width = if (widget.size.columns == 2) cell * 2 + gap else cell", 1)

        old_used = "        val used = last?.sumOf { it.size.columns } ?: 2"
        old_pack = "        if (last != null && used + widget.size.columns <= 2 && last.all { it.size.rows == widget.size.rows }) last += widget"
        if old_used not in t or old_pack not in t:
            raise SystemExit("Build 14: Today two-column packing rules not found")
        t = t.replace(old_used, "        val used = last?.sumOf { it.size.columns } ?: 4", 1)
        t = t.replace(old_pack, "        if (last != null && used + widget.size.columns <= 4 && last.all { it.size.rows == widget.size.rows }) last += widget", 1)

        old_edit = '                            JigglePill(stringResource(R.string.add_widget_2), Icons.Rounded.Add, description = "Add widget") { onAddWidget() }\n                            Spacer(Modifier.width(12.dp))\n                            JigglePill(stringResource(R.string.done), emphasized = true) { edit.stop() }'
        new_edit = '                            JigglePill(stringResource(R.string.add_widget_2), Icons.Rounded.Add, description = "Add widget") { onAddWidget() }\n                            Spacer(Modifier.width(8.dp))\n                            JigglePill(if (showSuggestions) "Suggestions On" else "Suggestions Off") {\n                                showSuggestions = !showSuggestions\n                                todayPrefs.edit().putBoolean("show_suggestions", showSuggestions).apply()\n                            }\n                            Spacer(Modifier.width(8.dp))\n                            JigglePill(stringResource(R.string.done), emphasized = true) { edit.stop() }'
        if old_edit not in t:
            raise SystemExit("Build 14: Today edit controls not found")
        t = t.replace(old_edit, new_edit, 1)

