    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Reuse development signing key
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: folio-pixel-development-key-v1
    - name: Build Pixel Fold APK
      shell: bash
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon :app:assembleFast
    - name: Run unit tests
      continue-on-error: true
      shell: bash
      run: ./gradlew --no-daemon :app:testDebugUnitTest
    - name: Run lint
      continue-on-error: true
      shell: bash
      run: ./gradlew --no-daemon :app:lintDebug
    - name: Prepare APK
      shell: bash
      run: |
        mkdir -p output
        cp app/build/outputs/apk/fast/app-fast.apk output/Folio-Pixel-Fold.apk
        (cd output && sha256sum Folio-Pixel-Fold.apk > SHA256SUMS.txt)
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Folio-Pixel-Fold-APK
        path: output/
        if-no-files-found: error
        retention-days: 30
    - name: Publish latest Pixel Fold release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="0.8.${GITHUB_RUN_NUMBER}"
        TAG="v${VERSION}"
        gh release create "$TAG" output/Folio-Pixel-Fold.apk output/SHA256SUMS.txt \
          --repo vNauj/Folio-Pixel \
          --title "Folio Pixel Fold ${VERSION}" \
          --notes "Pixel Fold Build 14.8.2 Balanced Slots ${VERSION}. Keeps the hard two-slot Inner clip, removes the duplicate rail-width reservation so both panes fill the usable display, balances Inner outer margins, and fixes the Cover Today left inset while preserving Cover Home/Library sizing and the five-icon dock." \
          --latest
