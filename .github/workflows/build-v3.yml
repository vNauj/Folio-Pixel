# Upload this file, then rename it to .github/workflows/build.yml on GitHub.
# Folio / DuoLauncher are MIT licensed; their notices are retained in the APK output.
# Build 3: tunable Pixel Fold geometry, centered inner dock, clearer liquid glass, and experimental Duo fold morph.
name: Build Pixel Fold APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
permissions:
  contents: read
concurrency:
  group: pixel-fold-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch the exact Folio version used for this patch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: McCal-Codes/folio
          ref: 9f38861fb7d8c89896a6db0c762fd988acfc45f2
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle and validate its wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      # Cache is a convenience, not a permanent signing-key backup.
      # If evicted, a new development key will require reinstalling Folio Dev.
      - name: Reuse development signing key when available
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: folio-pixel-development-key-v2
      - name: Apply Pixel Fold Build 3 changes
        shell: bash
        env:
          LAYOUT_PATCH_GZIP: 
        run: |
          python3 - <<'PYTHON'
          import base64, gzip, os, pathlib
          patch = gzip.decompress(base64.b64decode(os.environ['LAYOUT_PATCH_GZIP']))
          pathlib.Path('/tmp/folio-pixel-build3.patch').write_bytes(patch)
          PYTHON
          git apply --check /tmp/folio-pixel-build3.patch
          git apply /tmp/folio-pixel-build3.patch
          git diff --check
      - name: Test, lint and build optimized Folio Dev
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleFast
      - name: Prepare download
        run: |
          mkdir -p output
          cp app/build/outputs/apk/fast/app-fast.apk output/Folio-Pixel-Fold.apk
          cp LICENSE THIRD_PARTY_NOTICES.md output/
          cp /tmp/folio-pixel-build3.patch output/
          sha256sum output/Folio-Pixel-Fold.apk > output/SHA256.txt
      - name: Download this APK bundle
        uses: actions/upload-artifact@v7
        with:
          name: Folio-Pixel-Fold-APK
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Build-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
